dataset:
  name: NASA C-MAPSS
  subset: FD001
  target: rul

split:
  strategy: official_train_test_plus_internal_validation
  validation_fraction: 0.2
  validation_random_seed: 42
  test_set: official_cmapss_test

preprocessing:
  scaler: standard
  fit_on: training_only

window:
  size: 20
  stride: 1
  target_alignment: last_timestep

evaluation:
  metrics:
    - mae
    - rmse
    - r2

reproducibility:
  seed: 42
